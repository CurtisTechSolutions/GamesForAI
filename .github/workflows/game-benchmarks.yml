name: Game benchmarks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tictactoe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p gfa-game-tictactoe --bench playout --locked
  sudoku:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo bench -p gfa-game-sudoku --bench solve --locked
