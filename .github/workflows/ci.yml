name: Rust CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Prepare SQLite schema for query checking
        run: python3 .github/scripts/sqlite-query-check.py prepare
        env:
          GFA_SQLX_WORK_DIR: ${{ runner.temp }}/gfa-sqlx
      - run: cargo test --workspace --all-features --locked
        env:
          DATABASE_URL: sqlite:${{ runner.temp }}/gfa-sqlx/schema.sqlite
          SQLX_OFFLINE_DIR: ${{ runner.temp }}/gfa-sqlx/queries
      - name: Capture query metadata
        if: always()
        run: |
          python3 -c 'import json,pathlib,os; p=pathlib.Path(os.environ["GFA_SQLX_WORK_DIR"])/"queries"; print("GFA_SQLX_JSON:"+json.dumps({x.name:x.read_text() for x in p.glob("*.json")}))'
        env:
          GFA_SQLX_WORK_DIR: ${{ runner.temp }}/gfa-sqlx
      - name: Verify offline query metadata
        run: python3 .github/scripts/sqlite-query-check.py verify
        env:
          GFA_SQLX_WORK_DIR: ${{ runner.temp }}/gfa-sqlx
      - run: cargo build -p gfa-cli --locked
      - run: python3 .github/scripts/local-server-smoke.py
      - name: Export generated OpenAPI
        run: cargo run -p gfa-http --example export-openapi --locked > target/openapi.json
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: target/openapi.json
      - run: cargo xtask check-deps
      - run: cargo check -p gfa-games --no-default-features --locked
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny --locked check
  core-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-semver-checks
      - name: Check core compatibility against the PR base
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if git cat-file -e "$BASE_REF:crates/core/gfa-core/Cargo.toml"; then
            cargo semver-checks check-release -p gfa-core --baseline-rev "$BASE_REF"
          else
            echo "Initial core API: no baseline crate exists yet."
          fi
