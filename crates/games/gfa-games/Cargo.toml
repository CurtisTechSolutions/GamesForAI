[features]
default = ["tictactoe", "connect4", "sudoku"]
tictactoe = ["dep:gfa-game-tictactoe"]
connect4 = ["dep:gfa-game-connect4"]
sudoku = ["dep:gfa-game-sudoku"]

[dependencies]
