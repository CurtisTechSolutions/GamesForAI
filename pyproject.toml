[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "gamesforai"
version = "0.1.0"
description = "Native game environments for model training and evaluation"
requires-python = ">=3.10"
license = "GPL-3.0-only"
dependencies = ["numpy>=1.24,<3", "gymnasium>=1.2,<2", "pettingzoo>=1.25,<2"]

[project.scripts]
gfa-tournament = "gamesforai.tournament_cli:main"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
datasets = ["pyarrow>=18,<26"]
tournaments = ["PyYAML>=6,<7"]
training = ["sb3-contrib>=2.7,<3", "torch>=2.3,<3"]

[tool.maturin]
manifest-path = "crates/apps/gfa-py/Cargo.toml"
python-source = "python"
module-name = "gamesforai._native"
features = ["extension-module"]
