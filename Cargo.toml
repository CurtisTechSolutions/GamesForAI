[workspace]
resolver = "2"
members = [
    "crates/core/gfa-core",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/CurtisTechSolutions/GamesForAI"

[workspace.dependencies]
gfa-core = { version = "0.1.0", path = "crates/core/gfa-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "0.8.22"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
