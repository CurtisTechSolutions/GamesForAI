[workspace]
resolver = "2"
members = [
    "crates/core/gfa-core",
    "crates/core/gfa-testkit",
    "crates/games/gfa-game-tictactoe",
    "crates/games/gfa-game-connect4",
    "crates/games/gfa-game-sudoku",
    "crates/games/gfa-game-chess",
    "crates/games/gfa-games",
    "crates/adapters/gfa-store",
    "crates/adapters/gfa-http",
    "crates/adapters/gfa-mcp",
    "crates/apps/gfa-server",
    "crates/apps/gfa-cli",
    "crates/apps/gfa-py",
    "xtask",
    "crates/domain/gfa-api-types",
    "crates/domain/gfa-service",
    "crates/players/gfa-opponents",
    "crates/players/gfa-engine-uci",
    "crates/players/gfa-llm",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/CurtisTechSolutions/GamesForAI"

[workspace.dependencies]
pyo3 = { version = "0.29.2", features = ["abi3-py310"] }
numpy = "0.29.0"
rayon = "1.12"
gfa-core = { version = "0.1.0", path = "crates/core/gfa-core" }
gfa-testkit = { version = "0.1.0", path = "crates/core/gfa-testkit" }
gfa-game-tictactoe = { version = "0.1.0", path = "crates/games/gfa-game-tictactoe" }
gfa-games = { version = "0.1.0", path = "crates/games/gfa-games" }
gfa-game-connect4 = { version = "0.1.0", path = "crates/games/gfa-game-connect4" }
gfa-game-sudoku = { version = "0.1.0", path = "crates/games/gfa-game-sudoku" }
gfa-game-chess = { version = "0.1.0", path = "crates/games/gfa-game-chess" }
shakmaty = "0.30.1"
gfa-api-types = { version = "0.1.0", path = "crates/domain/gfa-api-types" }
gfa-opponents = { version = "0.1.0", path = "crates/players/gfa-opponents" }
gfa-engine-uci = { version = "0.1.0", path = "crates/players/gfa-engine-uci" }
gfa-llm = { version = "0.1.0", path = "crates/players/gfa-llm" }
gfa-service = { version = "0.1.0", path = "crates/domain/gfa-service" }
gfa-http = { version = "0.1.0", path = "crates/adapters/gfa-http" }
gfa-mcp = { version = "0.1.0", path = "crates/adapters/gfa-mcp" }
rmcp = { version = "3.5.0", default-features = false, features = ["server", "transport-io"] }
gfa-store = { version = "0.1.0", path = "crates/adapters/gfa-store" }
gfa-server = { version = "0.1.0", path = "crates/apps/gfa-server" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
schemars = "0.8.22"
thiserror = "2"
jsonschema = { version = "0.29", default-features = false }

sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal", "time"] }
tempfile = "3"

axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }

uuid = { version = "1", features = ["v4"] }

tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
sha2 = "0.10.9"
utoipa = { version = "5.4.0", default-features = false, features = ["macros"] }
utoipa-swagger-ui = { version = "9.0.2", default-features = false, features = ["axum", "vendored"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
